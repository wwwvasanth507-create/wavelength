# ==============================================================================
# Wavelength Music Streaming Platform - Nginx Reverse Proxy Configuration
# Target OS: Ubuntu 24.04 LTS (Noble Numbat)
# Installation Directory: /opt/wave
# Usage:
#   1. Copy to /etc/nginx/sites-available/wavelength
#   2. Symlink: sudo ln -sf /etc/nginx/sites-available/wavelength /etc/nginx/sites-enabled/
#   3. Test & Reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your actual domain or IP address (e.g. music.example.com)

    # Increase maximum upload file size for high-bitrate audio & cover uploads in /opt/wave
    client_max_body_size 100M;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static uploads directory direct serving (MP3, WAV, JPG, PNG) from /opt/wave/uploads
    location /uploads/ {
        alias /opt/wave/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy all API requests and React SPA frontend requests to FastAPI (Uvicorn on port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for large file uploads / music streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
